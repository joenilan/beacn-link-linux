[package]
name = "beacn-linx-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "LinX egui reference interface"

[features]
default = []
native-catalog = ["beacn-linx-core/native-catalog"]
ui-qualification = []
private-session-test = ["native-catalog", "beacn-linx-core/private-session-test"]
status-tray = ["beacn-linx-core/status-tray"]

[dependencies]
beacn-linx-core = { path = "../app-core" }
beacn-link-protocol = { path = ".." }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[workspace]

[profile.dev]
debug = 1
