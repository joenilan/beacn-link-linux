[package]
name = "beacn-linx-gpui"
version = "0.1.7"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-only"

[features]
default = ["native-catalog", "status-tray"]
studio = ["native-catalog", "beacn-linx-core/desktop-session-test", "link"]
link = ["native-catalog", "beacn-linx-core/link"]
native-catalog = ["beacn-linx-core/native-catalog"]
status-tray = ["beacn-linx-core/status-tray"]
native-control = ["gpui-kit/test-support"]
private-session-test = ["native-catalog", "beacn-linx-core/private-session-test"]
ui-qualification = ["private-session-test", "gpui-kit/test-support"]
studio-session-test = ["ui-qualification", "beacn-linx-core/studio-session-test"]
native-playback-test = ["studio-session-test", "beacn-linx-core/native-playback-test"]

desktop-session-test = ["ui-qualification", "beacn-linx-core/desktop-session-test"]

[dependencies]
beacn-linx-core = { path = "../app-core" }
beacn-link-protocol = { path = ".." }
gpui-kit = "=0.7.3"
anyhow = "1"
raw-window-handle = "=0.6.2"
serde_json = "1"
semver = "=1.0.28"
sha2 = "=0.10.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }

[workspace]

[profile.dev]
debug = 1

# Raise the window from the tray on Wayland (see vendor/README-LINX-PATCHES.md).
[target.'cfg(target_os = "linux")'.dependencies]
gpui-fast-linux = "=0.1.8"

[patch.crates-io]
ksni = { path = "../vendor/ksni" }
gpui-fast-linux = { path = "../vendor/gpui-fast-linux" }
gpui-component = { path = "../vendor/gpui-component" }
