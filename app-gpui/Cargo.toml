[package]
name = "beacn-linx-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["native-catalog", "status-tray"]
native-catalog = ["beacn-linx-core/native-catalog"]
status-tray = ["beacn-linx-core/status-tray"]
private-session-test = ["native-catalog", "beacn-linx-core/private-session-test"]
ui-qualification = ["private-session-test", "gpui-kit/test-support"]

[dependencies]
beacn-linx-core = { path = "../app-core" }
beacn-link-protocol = { path = ".." }
gpui-kit = "=0.7.3"
anyhow = "1"
raw-window-handle = "=0.6.2"

[workspace]

[profile.dev]
debug = 1
