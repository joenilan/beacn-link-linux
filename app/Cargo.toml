[package]
name = "beacn-linx-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Beacn LinX Rust application interface"

[features]
default = []
native-catalog = ["beacn-link-protocol/native-pipewire"]
ui-qualification = []
private-session-test = ["native-catalog", "beacn-link-protocol/qualification-peer"]
status-tray = ["dep:ksni"]

[dependencies]
beacn-link-protocol = { path = ".." }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", optional = true, features = ["blocking"] }

[workspace]

[profile.dev]
debug = 1
