# Keep the BEACN Studio USB2 Link hardware nodes at the rate required by the
# Studio while leaving the PipeWire graph clock and other devices unchanged.
monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.card.name = "BEACN Studio Link"
        api.alsa.split.parent = true
      }
    ]
    actions = {
      update-props = {
        audio.rate = 96000
        audio.allowed-rates = [ 96000 ]
      }
    }
  }
]
