[package]
name = "beacn-link-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "LinX: unofficial BEACN Link app for Linux"
license = "GPL-3.0-only"

[features]
default = []
native-pipewire = []
native-test-faults = ["native-pipewire"]
native-usb = []
native-playback = ["native-pipewire", "native-usb"]
native-desktop-target = ["native-playback"]
qualification-peer = []

[lib]
name = "beacn_link_protocol"
path = "src/lib.rs"

[[bin]]
name = "link-protocol"
path = "src/main.rs"
